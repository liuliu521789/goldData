name: gold-crawler

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "[WARN] requirements.txt not found, installing minimal dependencies"
            pip install Flask Flask-Cors requests beautifulsoup4 schedule
          fi

      - name: Run crawler scripts
        run: |
          python crawler/fetch_cngold_market.py || echo "[WARN] fetch_cngold_market failed, continue with fallback data generation"
          python generate_static_market_data.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          required_files = [
              "data/latest_market.js",
              "data/latest_news.js",
          ]

          for p in required_files:
              if not os.path.exists(p):
                  print(f"[ERROR] missing file: {p}")
                  sys.exit(1)
              if os.path.getsize(p) < 50:
                  print(f"[ERROR] file too small: {p}")
                  sys.exit(1)

          with open("data/latest_news.js", "r", encoding="utf-8") as f:
              news_text = f.read()
          if "module.exports" not in news_text or '"list"' not in news_text:
              print("[ERROR] latest_news.js invalid structure")
              sys.exit(1)

          with open("data/latest_market.js", "r", encoding="utf-8") as f:
              market_text = f.read()
          if "module.exports" not in market_text:
              print("[ERROR] latest_market.js invalid structure")
              sys.exit(1)

          bundle_path = "static/market_bundle.js"
          if os.path.exists(bundle_path) and os.path.getsize(bundle_path) >= 50:
              with open(bundle_path, "r", encoding="utf-8") as f:
                  bundle_text = f.read()
              for key in ["bankGoldList", "fundList", "storeList", "metalPrices"]:
                  if re.search(rf'"{key}"\s*:', bundle_text) is None:
                      print(f"[ERROR] market_bundle.js missing key: {key}")
                      sys.exit(1)
          else:
              print("[WARN] market_bundle.js missing or too small; fallback data only this run")

          print("[OK] generated data validation passed")
          PY

      - name: Commit changed data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static
          git diff --cached --quiet || git commit -m "chore: update market data by scheduler"
          git push

      - name: Export JSON for GitHub Pages
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          os.makedirs("pages-dist", exist_ok=True)

          def js_module_to_json(src, dst):
              if not os.path.exists(src):
                  print(f"[ERROR] source file missing: {src}")
                  sys.exit(1)
              text = open(src, "r", encoding="utf-8").read().strip()
              text = re.sub(r"^\s*module\.exports\s*=\s*", "", text)
              text = re.sub(r";\s*$", "", text)
              try:
                  obj = json.loads(text)
              except json.JSONDecodeError as e:
                  print(f"[ERROR] parse module to json failed: {src} {e}")
                  sys.exit(1)
              with open(dst, "w", encoding="utf-8") as f:
                  json.dump(obj, f, ensure_ascii=False, indent=2)

          js_module_to_json("data/latest_market.js", "pages-dist/latest_market.json")
          js_module_to_json("data/latest_news.js", "pages-dist/latest_news.json")
          print("[OK] exported pages-dist/latest_market.json")
          print("[OK] exported pages-dist/latest_news.json")
          PY

      - name: Publish JSON to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-dist
          publish_branch: gh-pages
